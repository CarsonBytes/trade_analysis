services:
  dashboard:
    build: .
    container_name: quant-dashboard-docker
    restart: unless-stopped
    environment:
      - BROKER=ib
      - UNIVERSE=etf
      - DASH_FIXED_MODE=paper
      - DASH_PORT=8090
      # Absolute path -> pathlib's `parents[1] / DASH_DB_NAME` resolves to exactly this,
      # discarding the base (standard pathlib join-with-absolute-path behavior). Keeps this
      # deployment's data in the container's own volume, never anywhere near the native
      # Windows deployment's dashboard/dashboard.db or dashboard_live.db.
      - DASH_DB_NAME=/data/dashboard_docker.db
      - IB_HOST=ib-gateway
      # 4004, NOT 4002 -- confirmed live 2026-08-13 via `ps aux` inside the gateway container:
      # this image runs `socat TCP-LISTEN:4004,fork TCP:127.0.0.1:4002`, exactly matching the
      # gnzsnz README's own documented reason ("IB Gateway restricts connections to container's
      # 127.0.0.1" by default). 4002 is real but only reachable from inside that container;
      # 4004 is the relay other containers on this network can actually reach. Using 4002 here
      # produced a real, confusing symptom: the Gateway's own UI showed "API Server: connected"
      # (green, genuinely logged in to IBKR) while the dashboard endlessly retried with
      # ConnectionRefused/TimeoutError -- looked like a broken login, was actually just the
      # wrong port.
      - IB_PORT=4004
      # Distinct from the native deployment's clientId=7 (paper) / 21 (live) -- avoids any
      # collision if this container and the native paper Gateway ever run against the IB API
      # at the same time.
      - IB_CLIENT_ID=31
    ports:
      # Host 18080 -> container 8090, deliberately far from the native deployment's
      # 8080 (paper) / 8081 (live) -- fully parallel, nothing to collide with.
      - "18080:8090"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - quant_docker_data:/data
      - quant_docker_logs:/app/logs
    depends_on:
      - ib-gateway

  # SWITCHED TO REAL LOGIN 2026-08-12: IBKR allows only ONE active session per username
  # (confirmed via research) -- since that's a hard constraint, not a workaround-able one, the
  # user chose to make Docker the operative paper session instead of running two stubs. The
  # native Windows paper Gateway (C:\IBC\config.ini) must be STOPPED before this container logs
  # in, or the two fight over the same session -- see scripts/wsl2-docker-deploy.sh /
  # HANDOFF.md's 2026-08-12 cutover entry for the exact sequencing. Real credentials come from
  # `.env` (gitignored, never committed -- see .env.example for the two keys this needs) so
  # they never touch this tracked file or a git history.
  ib-gateway:
    # Built from Dockerfile.gateway (2026-08-13), not a bare `image:` reference -- that
    # Dockerfile FROMs the exact same digest-pinned base as before (still not `:stable`, same
    # determinism reasoning), just with xdotool + imagemagick baked in permanently. Installing
    # those by hand via `docker exec apt-get install` doesn't survive a recreate (confirmed
    # live, twice, mid-session: any docker-compose.yml change makes compose recreate this
    # service even when only the OTHER service's config actually changed) -- gateway-login.sh
    # needs xdotool every time this container is rebuilt, not just once.
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: quant-ibgateway-docker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TRADING_MODE=paper
      - VNC_SERVER_PASSWORD=
      - TWOFA_TIMEOUT_ACTION=restart
      # IBC's native handler for the "Existing session detected" dialog -- docs claim this
      # defaults to 'primary' already, but live testing (2026-08-12) showed the dialog still
      # required a manual click, so set explicitly rather than trust an ambiguous default.
      # 'primary' = this login wins, disconnects whatever other session (e.g. the native
      # Windows Gateway) is currently holding it.
      - EXISTING_SESSION_DETECTED_ACTION=primary
      # Confirmed live 2026-08-13: without this, "API client needs write access action
      # confirmation" sits unhandled indefinitely (IBC's automation does not auto-click it,
      # unlike the Warning/Pending-Tasks dialogs it does handle) -- the dashboard's first real
      # order-placement-capable connection attempt triggers IBKR's standard API-precautions
      # checkbox, which blocks the connection from ever completing until dismissed.
      - BYPASS_WARNING=yes
    ports:
      # Host 14002 purely for my own debugging (docker/wsl2-local only, not published
      # further) -- the dashboard service reaches it via the compose network's internal DNS
      # (ib-gateway:4002), this host mapping is optional convenience, not load-bearing.
      - "127.0.0.1:14002:4002"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  quant_docker_data:
  quant_docker_logs:

networks:
  default:
    # Distinct from study-platform's 172.28.0.0/16 (this machine's other WSL2 Docker project)
    # -- explicit subnet sidesteps Docker's auto-allocated pool running out after repeated
    # network create/destroy cycles during iteration.
    ipam:
      config:
        - subnet: 172.29.0.0/16
    driver_opts:
      # WSL2's real uplink (eth0) is MTU 1380 here (confirmed via `ip link show eth0`) but
      # Docker's bridge defaults to 1500 -- small packets (TCP handshake, DNS) succeed, larger
      # ones (a TLS ClientHello, e.g. yfinance/OpenAI calls) get silently blackholed since
      # PMTUD's "frag needed" ICMP replies don't make it back. Matching the bridge MTU to the
      # real uplink avoids generating oversized packets in the first place.
      com.docker.network.driver.mtu: "1380"
